[project]
name = "anon3pass"
version = "0.1.0"
description = "Configurable three-pass, reversible text anonymizer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "presidio-analyzer>=2.2.366",
  "spacy>=3.8,<3.9",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
  "faker>=40.44",
  "rapidfuzz>=3.14",
  "detect-secrets>=1.5",
  "pyyaml>=6.0.3",
  "cryptography>=50",
]
[project.optional-dependencies]
anthropic = ["anthropic>=2.5"]
gliner2 = ["gliner2>=2.1"]
[project.scripts]
anon = "anon3pass.cli:main"
[dependency-groups]
dev = ["pytest>=8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/anon3pass"]
[tool.hatch.metadata]
allow-direct-references = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
