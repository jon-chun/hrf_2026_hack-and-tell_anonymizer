<svg xmlns="http://www.w3.org/2000/svg" width="860" height="352" viewBox="0 0 860 352"><rect width="860" height="352" fill="#ffffff"/><text x="24" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="bold">Share of known sensitive values still leaked</text><text x="24" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">Lower is better. Small synthetic tests, not a guarantee.</text><text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Blind set 2: final rules, the result to trust</text><text x="40" y="121" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">Layers 1 and 2</text><rect x="210" y="104" width="160.49382716049382" height="24" rx="4" fill="#2a78d6"/><text x="380.4938271604938" y="121" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">10 of 81 (12%)</text><text x="40" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">After one audit round</text><rect x="210" y="138" width="2" height="24" rx="4" fill="#2a78d6"/><text x="222" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">0 of 81 (0%)</text><text x="24" y="194" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Blind set 1: tuned on this set, so not blind</text><text x="40" y="223" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">Layers 1 and 2</text><rect x="210" y="206" width="140.7216494845361" height="24" rx="4" fill="#a9a8a2"/><text x="360.7216494845361" y="223" font-family="Helvetica, Arial, sans-serif" font