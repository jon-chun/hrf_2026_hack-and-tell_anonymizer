<svg xmlns="http://www.w3.org/2000/svg" width="860" height="352" viewBox="0 0 860 352"><rect width="860" height="352" fill="#ffffff"/><text x="24" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="bold">Ranked edits for the fictional proposal</text><text x="24" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">Higher means fix sooner. These are editorial priorities, not funding probabilities.</text><text x="24" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Demonstrate realistic, safe delivery</text><rect x="370" y="90" width="404.79999999999995" height="24" rx="4" fill="#2a78d6"/><text x="784.8" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">10.12</text><text x="24" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Fix monitoring definitions and targets</text><rect x="370" y="126" width="284.8" height="24" rx="4" fill="#2a78d6"/><text x="664.8" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">7.12</text><text x="24" y="179" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Strengthen evidence of demand and track record</text><rect x="370" y="162" width="255.2" height="24" rx="4" fill="#2a78d6"/><text x="635.2" y="179" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">6.38</text><text x="24" y="215" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Substantiate costs and pending co-funding</text><rect x="370" y="198" width="190.0" height="24" rx="4" fill="#2a78d6"/><text x="570.0" y="215" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">4.75</text><text x="24" y="251" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Clarify outcomes and attribution</text><rect x="370" y="234" width="170.0" height="24" rx="4" fill="#2a78d6"/><text x="550.0" y="251" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">4.25</text><text x="24" y="287" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Specify secure evidence handling</text><rect x="370" y="270" width="135.2" height="24" rx="4" fill="#2a78d6"/><text x="515.2" y="287" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">3.38</text><text x="24" y="323" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">Improve editorial and outreach detail</text><rect x="370" y="306" width="80.0" height="24" rx="4" fill="#2a78d6"/><text x="460.0" y="323" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="normal">2.00</text></svg>
